<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculator-container">
        <h1>JS Calculator</h1>

        <div class="input-group">
            <label for="num1">Number 1</label>
            <input type="number" id="num1" placeholder="30">
        </div>

        <div class="input-group">
            <label for="num2">Number 2</label>
            <input type="number" id="num2" placeholder="60">
        </div>

        <div class="input-group">
            <label for="operator">Operate way?</label>
            <select id="operator">
                <option value="+">+</option>
                <option value="-">-</option>
                <option value="*">*</option>
                <option value="/">/</option>
            </select>
        </div>

        <button id="calcBtn">Add</button>

        <div id="result" style="margin-top: 20px; font-weight: bold;">Result = </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
