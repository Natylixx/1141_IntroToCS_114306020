<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
</head>
<body>
<h1>114306020_Number Guessing Game</h1>
<div id="result"></div>
<script>
	var chance=7;
	var answer=Math.floor(Math.random()*100+1);
	var minimum=1;
	var maximum=100;
	var resultDiv = document.getElementById('result');
	while(chance>0){
		alert("請輸入"+minimum+"到"+maximum+"之間的整數。\n你還有"+chance+"次機會。")
		var input = Number(window.prompt());

		while(input > maximum || input < minimum || isNaN(input)){
			alert("無效數字！");
			input = Number(window.prompt("請重新輸入"));
		}

		if (input>answer){
			maximum=input;
		}else if(input<answer){
			minimum=input;
		}else if(input===answer){
			alert("恭喜你答對了，正確答案是"+answer);
			var img = document.createElement('img');
			img.src = 'correct.jpg';  // <-- 替換成你的圖片路徑
			img.alt = '正確答案圖片';
			resultDiv.appendChild(img);
			break;

		}
		chance-=1;
		if (chance===0){
			alert("很遺憾你失敗了QQ");
			var img = document.createElement('img');
			img.src = 'wrong.jpg';   // <-- 替換成你的圖片路徑
			img.alt = '失敗圖片';
			resultDiv.appendChild(img);
		}
	}
</script>
</body>
</html>
